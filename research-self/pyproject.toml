[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-ingest"
version = "0.1.0"
description = "Local multi-venue research paper collector and API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "python-dotenv>=1,<2", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
openreview-sdk = ["openreview-py>=2.8,<3"]
# The dense semantic space. Without it the search falls back to the corpus's
# own TF-IDF/SVD vectors -- everything works, the ranking is just weaker
# (measured: a paper found by its own abstract, rank 1, 99.2% with the dense
# model against 57.5% without it). The model itself is downloaded once at
# build time; the project then runs offline from its own files.
dense = ["model2vec>=0.10,<1"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "pytest-asyncio>=0.24,<2", "playwright>=1.50,<2"]

[tool.setuptools]
packages = ["paper_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
