# Expected corpus sizes per venue-year.
#
# WHY THIS EXISTS
# ---------------
# A harvest can come back small and still report success: a provider changes
# its markup, a rate limiter starts answering 401, a volume page is served
# truncated. Nothing raises, the sync simply writes fewer papers, and the
# corpus quietly loses a venue-year. These numbers are the durable expectation
# that turns such a harvest into a *reported* shortfall.
#
# SEMANTICS
# ---------
#   min_papers  the floor: a harvest below it is reported as "short".
#   max_papers  the ceiling: a harvest above it is reported as "over"
#               (usually a duplicated or mis-scoped import). Optional.
#   note        free text explaining the number; optional.
#
# A venue-year with no entry has no expectation and is reported as "unknown".
# The manifest itself is optional: with no file at all, every venue-year is
# simply "unknown" and no harvest is affected.
#
# WHERE THIS IS READ FROM
# -----------------------
# paper_ingest/manifest.py reads this block from
# <DATA_ROOT>/expected_counts.yaml (DATA_ROOT defaults to ../Data). Copy the
# `expected:` block below into that file to activate the check; the registry
# loader ignores unknown top-level keys, so the two can live in one file too.
#
# WHERE THE NUMBERS COME FROM
# ---------------------------
# Measured 2026-10-21 with
#   SELECT pv.venue_id, pv.year, count(DISTINCT pv.paper_id)
#   FROM paper_venues pv GROUP BY 1,2
# against Data/database/papers.sqlite (196,611 papers in total). min_papers is
# ~90% and max_papers ~110% of the measured count, rounded to a sane step
# (50 for >=1000 papers, 10 for >=100, 5 below), so ordinary year-to-year
# jitter is tolerated but a real loss of a volume is not.
expected:
  iclr:
    2022: {min_papers: 950, max_papers: 1250}
    2023: {min_papers: 1400, max_papers: 1750}
    2024: {min_papers: 2050, max_papers: 2550}
    2025: {min_papers: 3400, max_papers: 4250}
    2026: {min_papers: 4900, max_papers: 6050}
